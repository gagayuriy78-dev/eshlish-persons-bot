[project]
name = "blank-python-project"
version = "0.1.0"
description = "ISHLISH PERSONS English learning Telegram bot."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "fastapi>=0.142.2",
    "pillow>=12.3.0",
    "uvicorn>=0.54.0",
]

[tool.setuptools]
py-modules = ["main", "question_bank", "quiet_progress"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
